<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>위기ON – 국제사회 위기 상황 통합 지원 플랫폼</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#5d6b82;--line:#dfe4ec;--main:#1f5eff;--main-d:#1646c4;--red:#d93025;--org:#f08a00;--yel:#e8c400;--grn:#1e8e3e;--fs:16px;color-scheme:light}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select{font:inherit}
.emerg{background:var(--red);color:#fff;padding:8px 16px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.emerg a{color:#fff;font-weight:700}
.tools{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:10px 16px;max-width:1000px;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:5px 11px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--main);color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;padding:48px 16px 32px}
.hero h1{font-size:2.4rem;margin:0 0 8px;color:var(--main)}
.hero p{color:var(--mute);margin:0 0 28px;font-size:1.1rem}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:10px;padding:12px 22px;cursor:pointer;font-weight:700;background:var(--main);color:#fff}
.btn:hover{background:var(--main-d)}
.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn:disabled{background:#b9c2d3;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 6px}
.sub{color:var(--mute);font-size:.92rem;margin:0 0 14px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.page-head h2{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb label{font-weight:500;margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;border-radius:8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.msg{padding:10px 12px;border-radius:8px;margin-top:12px;font-size:.92rem}
.msg.err{background:#fdecea;color:#a1271b}.msg.ok{background:#e6f4ea;color:#17692f}.msg.info{background:#e8f0fe;color:#1a3fa8}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;background:#6b778c}
.b-ok{background:var(--grn)}.b-warn{background:var(--org)}.b-red{background:var(--red)}.b-blue{background:var(--main)}.b-gray{background:#8793a6}
.prog{height:12px;background:#e6eaf2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk input{margin-top:5px}
.rcpt{font-size:1.7rem;font-weight:800;letter-spacing:.06em;color:var(--main);background:#eef3ff;border-radius:10px;padding:10px 14px;display:inline-block;margin:6px 0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:10px 0}
.steps span{display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(.62rem,2.9vw,.8rem);line-height:1.25;word-break:keep-all;padding:7px 2px;border-radius:8px;background:#eceff5;color:var(--mute)}
.steps span.on{background:var(--main);color:#fff;font-weight:700}
.steps span.past{background:#cfe0ff;color:var(--main-d)}
.map{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"N C E" "W S K";gap:8px}
.tile{border-radius:12px;padding:14px 10px;text-align:center;color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile b{font-size:1.05rem}.tile .n{font-size:1.9rem;font-weight:800;line-height:1.1}
.t-red{background:var(--red)}.t-org{background:var(--org)}.t-yel{background:var(--yel);color:#3a3000}
.legend{font-size:.88rem;color:var(--mute);margin-top:8px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
.bar .lb{width:150px;flex:none}.bar .tr{flex:1;background:#e6eaf2;border-radius:6px;height:18px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--main)}
.bar .v{width:130px;flex:none;text-align:right;color:var(--mute);font-size:.85rem}
.req{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.req .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.req .meta{color:var(--mute);font-size:.9rem;margin:6px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.act select{width:auto;min-width:180px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.foot{color:var(--mute);font-size:.85rem;text-align:center;padding:20px 16px}
.hide{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 4px;color:var(--mute);font-size:.85rem}
ul.plain{padding-left:20px;margin:6px 0}
@media(max-width:560px){.bar .lb{width:95px}.bar .v{width:80px}.hero h1{font-size:2rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================== 기본 데이터 ================== */
const TYPES=[
 {k:'disaster',ko:'재난 (지진·홍수 등)',en:'Disaster (earthquake, flood…)'},
 {k:'war',ko:'전쟁·분쟁 지역',en:'War / conflict zone'},
 {k:'epidemic',ko:'감염병 확산 지역',en:'Epidemic outbreak'}];
const CATS=[
 {k:'medical',ko:'의료·응급 (Medical)',en:'Medical & Emergency'},
 {k:'food',ko:'식량·식수 (Food & Water)',en:'Food & Water'},
 {k:'medicine',ko:'의약품 (Medicine)',en:'Medicine'},
 {k:'shelter',ko:'주거·대피소 (Shelter)',en:'Shelter'},
 {k:'psych',ko:'심리상담 (Psychological)',en:'Psychological support'}];
const AGST=[
 {k:'active',ko:'운영 중 (Active)',en:'Active',c:'b-ok'},
 {k:'saturated',ko:'포화 (Saturated)',en:'Saturated',c:'b-warn'},
 {k:'review',ko:'확인 필요 (Review Needed)',en:'Review needed',c:'b-gray'},
 {k:'closed',ko:'폐쇄 (Closed)',en:'Closed',c:'b-red'}];
/* 가상 6개 지역 + 지역명 별칭(상위 행정구역 분류용) */
const REG=[
 {id:'N',ko:'북부 지구',en:'North District',al:['북부','북구','용산동','상북동','north']},
 {id:'S',ko:'남부 지구',en:'South District',al:['남부','남구','하남동','청계동','south']},
 {id:'E',ko:'동부 지구',en:'East District',al:['동부','동구','해돋이동','새벽동','east']},
 {id:'W',ko:'서부 지구',en:'West District',al:['서부','서구','석양동','서래동','west']},
 {id:'C',ko:'중앙 지구',en:'Central District',al:['중앙','중구','시청동','중앙동','center','central']},
 {id:'K',ko:'해안 지구',en:'Coastal District',al:['해안','항구동','바닷가','갯마을동','coast']}];
const FLOW=['received','reviewing','linked','progress','done'];
const FLOWL={received:['접수','Received'],reviewing:['확인중','Reviewing'],linked:['기관 연결','Agency linked'],progress:['지원 진행','In progress'],done:['완료','Completed']};
const ORGS={
 ocha:{name:'UN OCHA',role:['인도지원 조정','Humanitarian coordination']},
 who:{name:'WHO',role:['보건·감염병 대응','Health & epidemics']},
 unicef:{name:'UNICEF',role:['아동·심리 지원','Child & psychosocial support']},
 wfp:{name:'WFP',role:['식량 지원','Food assistance']},
 ifrc:{name:'IFRC',role:['적십자·구호','Red Cross & relief']}};
/* 공공기관 공식 재난 정보 (데모 데이터): 제보 내용과 대조하는 기준 */
const OFFICIAL=[
 {region:'N',type:'disaster',src:['가상 기준 데이터 – 지진 피해','Sample data – earthquake']},
 {region:'W',type:'disaster',src:['가상 기준 데이터 – 홍수 피해','Sample data – flood']},
 {region:'K',type:'disaster',src:['가상 기준 데이터 – 해일 피해','Sample data – tsunami']},
 {region:'E',type:'war',src:['가상 기준 데이터 – 분쟁 피해','Sample data – conflict']},
 {region:'S',type:'epidemic',src:['가상 기준 데이터 – 감염병 확산','Sample data – outbreak']}];
const TIPS={
 disaster:{ko:['튼튼한 탁자 아래나 건물 중심부로 이동해 머리를 보호하세요.','엘리베이터 대신 계단을 이용하고, 가스·전기를 차단하세요.','침수 지역에서는 전기 시설에 접근하지 말고 높은 곳으로 대피하세요.','비상 가방(물, 식량, 의약품, 손전등, 배터리)을 챙기세요.','공식 대피소 위치와 가족 연락 방법을 미리 정하세요.'],
  en:['Take cover under sturdy furniture and protect your head.','Use stairs, not elevators; shut off gas and electricity.','In flooded areas avoid electrical equipment and move to high ground.','Prepare an emergency bag (water, food, medicine, flashlight, power bank).','Know your official shelter and agree on a family contact plan.']},
 war:{ko:['창문에서 떨어진 건물 안쪽 낮은 층의 대피 공간으로 이동하세요.','공식 대피 경로와 안전 통로 안내를 확인하세요.','신분증과 필수 의약품, 충전된 통신기기를 지니세요.','불필요한 이동을 줄이고 확인되지 않은 소문을 공유하지 마세요.','국제기구가 지정한 인도주의 통로와 구호소 안내를 따르세요.'],
  en:['Move to an interior, low-level shelter away from windows.','Check official evacuation routes and safe corridors.','Carry ID, essential medicine and a charged phone.','Limit unnecessary movement; do not share unverified rumors.','Follow humanitarian corridors and aid points designated by international agencies.']},
 epidemic:{ko:['마스크를 착용하고 손을 자주 30초 이상 씻으세요.','증상이 있으면 다른 사람과 거리를 두고 의료기관에 먼저 연락하세요.','밀집된 장소를 피하고 실내를 자주 환기하세요.','깨끗한 물과 위생 용품을 확보하세요.','공식 방역 지침과 예방접종 안내를 확인하세요.'],
  en:['Wear a mask and wash hands for 30+ seconds often.','If symptomatic, keep distance and call a health facility first.','Avoid crowds and ventilate indoor spaces.','Secure clean water and hygiene supplies.','Follow official health guidance and vaccination notices.']}};

/* ================== 상태 / 저장 ================== */
const KEY='wigion_v2';
let S={lang:'ko',fs:'normal',view:'home',vtab:'info',atab:'map',ctype:'disaster',filter:'all',session:null,remember:false,
 requests:[],agencies:[],checks:{},myNo:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify({requests:S.requests,agencies:S.agencies,checks:S.checks,lang:S.lang,fs:S.fs,session:S.remember?S.session:null}))}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 const valid=d&&Array.isArray(d.requests)&&Array.isArray(d.agencies)&&d.requests.every(r=>r&&typeof r.id==='string'&&FLOW.includes(r.status)&&REG.some(g=>g.id===r.region)&&TYPES.some(t=>t.k===r.type)&&CATS.some(c=>c.k===r.cat))&&d.agencies.every(a=>a&&typeof a.id==='string'&&ORGS[a.org]&&Array.isArray(a.cats)&&['active','saturated','review','closed'].includes(a.status));
 if(valid){S.requests=d.requests;S.agencies=d.agencies;S.checks=d.checks&&typeof d.checks==='object'?d.checks:{};S.lang=d.lang==='en'?'en':'ko';S.fs=['small','normal','large'].includes(d.fs)?d.fs:'normal';if(d.session&&ORGS[d.session.org]){S.session=d.session;S.remember=true}}
 else {S.session=null;S.remember=false;seed();}}
const _=(ko,en)=>S.lang==='ko'?ko:en;
const lab=o=>S.lang==='ko'?o.ko:o.en;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const by=(arr,k)=>arr.find(x=>x.k===k)||{};
const regOf=id=>REG.find(r=>r.id===id)||{};

/* ================== 핵심 로직(오류 수정 반영) ================== */
/* 오류② 지역명 입력 방식이 달라도 상위 행정구역으로 분류 */
function normRegion(input){
 const n=String(input||'').toLowerCase().replace(/\s+/g,'').replace(/지구$/,'');
 if(n.length<2)return null;
 for(const r of REG){for(const a of r.al){const x=a.toLowerCase().replace(/\s+/g,'');if(n===x)return r.id}}
 const matches=[];
 for(const r of REG){for(const a of r.al){const x=a.toLowerCase().replace(/\s+/g,'');if(x.length>=3&&(n.includes(x)||x.includes(n)))matches.push({id:r.id,len:x.length})}}
 matches.sort((a,b)=>b.len-a.len);
 return matches.length&&(!matches[1]||matches[0].len>matches[1].len)?matches[0].id:null;}
/* 오류③ 접수번호는 기존 번호와 중복 확인 후 재발급 */
function newNo(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let no;
 do{no='WG-';for(let i=0;i<6;i++)no+=ch[Math.floor(Math.random()*ch.length)]}while(S.requests.some(r=>r.id===no));
 return no;}
/* 오류⑦ 제보 내용과 가상 기준 데이터 대조 → 일치할 때만 '기준 일치' */
function factCheck(r){return OFFICIAL.some(o=>o.region===r.region&&o.type===r.type)}
/* 오류⑥ 운영 중이면서 분야·지역이 맞는 기관만 연결 대상 (포화·폐쇄·확인필요 제외) */
function eligible(r){return S.agencies.filter(a=>a.status==='active'&&a.cats.includes(r.cat)&&(a.region==='ALL'||a.region===r.region))}
function orgsEligible(r){const seen={};return eligible(r).filter(a=>seen[a.org]?false:(seen[a.org]=1))}
/* 오류⑤ 진행 단계는 순서대로만 변경 */
const nextOf=r=>FLOW[FLOW.indexOf(r.status)+1]||null;
function stamp(){return new Date().toISOString()}
function fmt(t){const d=new Date(t);if(Number.isNaN(d.getTime()))return '-';return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function seed(){
 const rows=[['N','disaster','medical',4,'received'],['N','disaster','shelter',12,'reviewing'],['N','disaster','food',8,'linked','unicef'],
 ['N','disaster','medicine',3,'received'],['N','disaster','psych',6,'received'],['W','disaster','shelter',9,'progress','ifrc'],
 ['W','disaster','food',5,'received'],['W','disaster','medical',2,'done','who'],['E','war','medical',7,'reviewing'],
 ['E','war','shelter',15,'received'],['S','epidemic','medicine',20,'received'],['K','disaster','shelter',10,'received'],
 ['S','war','food',3,'received'],['C','epidemic','medical',2,'received']];
 S.requests=rows.map((x,i)=>{const r={id:'WG-DEMO'+String(i+1).padStart(2,'0'),type:x[1],cat:x[2],people:x[3],region:x[0],regionInput:regOf(x[0]).ko,
  contact:'+000-555-01'+String(10+i),created:stamp(),updated:stamp(),status:x[4],agency:x[5]||null};r.verified=factCheck(r);return r});
 S.agencies=[
  {id:'a1',org:'ocha',cats:['medical','shelter'],status:'active',region:'ALL'},
  {id:'a2',org:'who',cats:['medical','medicine'],status:'active',region:'ALL'},
  {id:'a3',org:'unicef',cats:['psych','food'],status:'active',region:'ALL'},
  {id:'a4',org:'wfp',cats:['food'],status:'saturated',region:'N'},
  {id:'a5',org:'ifrc',cats:['shelter','medical','psych'],status:'active',region:'ALL'}];
 save();}

/* ================== 화면 ================== */
const FIELDS=['f-type','f-cat','f-people','f-area','f-contact','f-reg'];
function snap(){const o={};FIELDS.forEach(i=>{const e=document.getElementById(i);if(e)o[i]=e.value});return o}
function restore(o){FIELDS.forEach(i=>{const e=document.getElementById(i);if(e&&o[i]!==undefined&&o[i]!=='')e.value=o[i]});
 if(o['f-reg']){const b=document.getElementById('f-reg-box');if(b)b.classList.remove('hide')}
 if(document.getElementById('f-area'))areaHint()}
function render(){
 const keep=(S.view==='victim'&&S.vtab==='req'&&document.getElementById('f-area'))?snap():null;
 document.documentElement.lang=S.lang;
 document.documentElement.style.setProperty('--fs',{small:'14px',normal:'16px',large:'18.5px'}[S.fs]);
 let body='';
 if(S.view==='home')body=home();else if(S.view==='login')body=login();else if(S.view==='victim')body=victim();else body=agencyView();
 $('#app').innerHTML=`
 <div class="emerg">🚨 ${_('긴급 상황에서는 현지 긴급 신고 번호와 구조기관을 우선 이용하세요. (대한민국: 119)','In an emergency, contact local emergency services first. (South Korea: 119)')} <a href="tel:119">${_('대한민국 119','South Korea: 119')}</a></div>
 <div class="tools">
  <div class="seg"><button class="${S.lang==='ko'?'on':''}" onclick="setLang('ko')">한국어</button><button class="${S.lang==='en'?'on':''}" onclick="setLang('en')">English</button></div>
  <div class="seg"><button class="${S.fs==='small'?'on':''}" onclick="setFs('small')">${_('작게','Small')}</button><button class="${S.fs==='normal'?'on':''}" onclick="setFs('normal')">${_('보통','Normal')}</button><button class="${S.fs==='large'?'on':''}" onclick="setFs('large')">${_('크게','Large')}</button></div>
 </div>
 <div class="wrap">${body}</div>
 <div class="foot">${_('수행평가용 가상 데모입니다. 실제 구조·의료 서비스가 아니며, 입력 정보는 이 브라우저에 저장됩니다. 실제 개인정보 대신 예시 정보를 사용하세요.','This is a school-project demo, not a real rescue or medical service. Data is stored in this browser. Use sample information, not real personal data.')}</div>`;
 if(keep)restore(keep);
}
function setLang(l){S.lang=l;save();render()}
function setFs(f){S.fs=f;save();render()}
function go(v){S.view=v;window.scrollTo(0,0);render()}

function home(){return `
 <div class="hero"><h1>위기ON</h1>
 <p>${_('재난·전쟁·감염병 피해자를 위한<br>국제사회 통합 지원 플랫폼','An integrated international support platform<br>for victims of disasters, war and epidemics')}</p>
 <div class="row"><button class="btn" onclick="S.vtab='info';go('victim')">${_('피해자: 바로 지원받기','Victims: Get help now')}</button>
 <button class="btn ghost" onclick="${S.session?"S.atab='map';go('agency')":"go('login')"}">${_('지원기구 로그인','Agency login')}</button></div></div>
 <div class="grid">
  <div class="card"><h3>📘 ${_('위기 상황별 정보','Crisis-specific info')}</h3><p class="sub">${_('대처 방법, 안전 수칙, 의료·생활·안전 정보','Coping guides, safety rules, medical/living/safety info')}</p></div>
  <div class="card"><h3>🗺️ ${_('피해 현황 및 지역 분석','Damage status & regional analysis')}</h3><p class="sub">${_('지역별 피해 규모와 지원 요청 현황을 지도와 통계로 확인','Regional damage and requests shown on a map and in statistics')}</p></div>
  <div class="card"><h3>🤝 ${_('맞춤형 지원 연결','Tailored support matching')}</h3><p class="sub">${_('피해 상황과 수요에 맞는 국제기구·지원단체 연결','Connecting victims with suitable agencies')}</p></div>
 </div>`}

function login(){return `
 <div class="page-head"><h2>${_('지원기구 인증 로그인','Agency login')}</h2><button class="btn ghost sm" onclick="go('home')">${_('뒤로','Back')}</button></div>
 <div class="card" style="max-width:460px;margin:0 auto">
  <p class="sub">${_('데모 계정: ocha, who, unicef, wfp, ifrc (비밀번호: 1234 / 수행평가용 가상 계정)','Demo accounts: ocha, who, unicef, wfp, ifrc (password: 1234 / demo accounts only)')}</p>
  <label>${_('기관 아이디','Agency ID')}</label><input type="text" id="l-id" autocomplete="username">
  <label>${_('비밀번호','Password')}</label><input type="password" id="l-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <label style="font-weight:500;display:flex;gap:8px;align-items:center"><input type="checkbox" id="l-keep" style="width:auto"> ${_('로그인 상태 유지','Keep me signed in')}</label>
  <div style="margin-top:14px"><button class="btn" style="width:100%" onclick="doLogin()">${_('로그인','Log in')}</button></div>
  <div id="l-msg"></div></div>`}
function doLogin(){const id=$('#l-id').value.trim().toLowerCase(),pw=$('#l-pw').value;
 if(ORGS[id]&&pw==='1234'){S.session={org:id};S.remember=$('#l-keep').checked;save();S.atab='map';go('agency')}
 else $('#l-msg').innerHTML=`<div class="msg err">${_('아이디 또는 비밀번호가 올바르지 않습니다.','Incorrect ID or password.')}</div>`}
function logout(){S.session=null;S.remember=false;save();go('home')}

/* ---------- 피해자 ---------- */
function victim(){
 const tabs=[['info',_('대처정보','Guidance')],['req',_('도움요청','Request help')],['mine',_('내요청확인','My request')],['priv',_('개인정보보호','Privacy')]];
 let c='';
 if(S.vtab==='info')c=vInfo();else if(S.vtab==='req')c=vReq();else if(S.vtab==='mine')c=vMine();else c=vPriv();
 return `<div class="page-head"><h2>${_('피해자 지원 안내소','Victim support desk')}</h2><button class="btn ghost sm" onclick="go('home')">${_('처음으로','Home')}</button></div>
 <div class="tabs">${tabs.map(t=>`<button class="${S.vtab===t[0]?'on':''}" onclick="S.vtab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${c}`}

function vInfo(){
 const tips=TIPS[S.ctype][S.lang],ch=(S.checks[S.ctype]||[]),done=tips.filter((_x,i)=>ch[i]).length,pct=Math.round(done/tips.length*100);
 return `<div class="card"><label style="margin-top:0">${_('위기 상황 선택','Select crisis situation')}</label>
  <select onchange="S.ctype=this.value;render()">${TYPES.map(t=>`<option value="${t.k}" ${S.ctype===t.k?'selected':''}>${lab(t)}</option>`).join('')}</select></div>
 <div class="card"><h3>${_('안전 수칙 및 체크리스트','Safety rules & checklist')}</h3><p class="sub">${_('대비 항목을 체크하면 완료율이 올라갑니다.','Check items to raise your completion rate.')}</p>
  <b>${_('완료율','Completion')} ${pct}%</b><div class="prog"><i style="width:${pct}%"></i></div>
  ${tips.map((t,i)=>`<label class="chk" style="font-weight:500;margin:0"><input type="checkbox" ${ch[i]?'checked':''} onchange="toggleCheck(${i},this.checked)"><span>${esc(t)}</span></label>`).join('')}</div>
 <div class="card"><h3>${_('의료·생활·안전 지원 안내','Medical, living & safety support guide')}</h3>
  <p class="sub">${_('UN OCHA 및 WHO 등 국제기구를 통해 식량 배급소, 임시 응급 의료소, 안전 대피소 위치 정보가 제공됩니다.','Locations of food distribution points, temporary emergency clinics and safe shelters are provided through UN OCHA, WHO and other agencies.')}</p>
  <div class="grid"><div class="req"><b>🍚 ${_('식량 배급소','Food distribution')}</b><div class="meta">${_('식량·식수 지급 위치와 시간 안내','Food & water points and hours')}</div></div>
  <div class="req"><b>🏥 ${_('임시 응급 의료소','Emergency clinics')}</b><div class="meta">${_('응급 처치 및 의약품 지원 위치 안내','First aid and medicine locations')}</div></div>
  <div class="req"><b>🏠 ${_('안전 대피소','Safe shelters')}</b><div class="meta">${_('주거·대피 가능 장소 안내','Available shelter sites')}</div></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="S.vtab='req';render()">${_('도움 요청하기','Request help')}</button></div></div>`}
function toggleCheck(i,v){const n=TIPS[S.ctype].ko.length;if(!S.checks[S.ctype])S.checks[S.ctype]=Array(n).fill(false);S.checks[S.ctype][i]=v;save();render()}

function vReq(){return `<div class="card"><h3>${_('긴급 지원 요청서','Emergency support request')}</h3>
 <p class="sub">${_('최소한의 정보로 빠르게 접수됩니다. (동네 단위까지만 입력)','Submitted quickly with minimal information. (Neighborhood-level location only)')}</p>
 <label>${_('피해 유형','Damage type')}</label><select id="f-type">${TYPES.map(t=>`<option value="${t.k}">${lab(t)}</option>`).join('')}</select>
 <label>${_('지원 종류 선택','Type of support')}</label><select id="f-cat">${CATS.map(t=>`<option value="${t.k}">${lab(t)}</option>`).join('')}</select>
 <label>${_('피해 인원','Number of people affected')}</label><input type="number" id="f-people" type="number" min="1" max="1000000" step="1" value="1">
 <label>${_('동네 단위 지역 (예: 용산동, 북부 지구 등)','Neighborhood (e.g. Yongsan-dong, North District)')}</label><input type="text" id="f-area" maxlength="60" oninput="areaHint()">
 <div id="f-reg-box" class="hide"><label>${_('입력한 지역을 찾지 못했어요. 가까운 지구를 선택해 주세요.','We could not match that area. Please choose the nearest district.')}</label>
  <select id="f-reg"><option value="">${_('지구 선택','Select district')}</option>${REG.map(r=>`<option value="${r.id}">${lab(r)}</option>`).join('')}</select></div>
 <div id="f-hint" class="sub" style="margin-top:4px"></div>
 <label>${_('연락 방법 (메시지 수신용 번호 또는 임시 코드)','Contact (number for messages or temporary code)')}</label><input type="text" id="f-contact" maxlength="80">
 <p class="sub" style="margin-top:6px">${_('데모 연락 정보는 브라우저 저장소에 일반 텍스트로 저장됩니다. 실제 개인정보 대신 예시 정보를 입력하세요.','Demo contact details are stored as plain text in this browser. Use sample information, not real personal data.')}</p>
 <div style="margin-top:12px"><button class="btn" onclick="submitReq()">${_('지원 요청 접수하기','Submit request')}</button></div>
 <div id="f-msg"></div></div>`}
function areaHint(){const v=$('#f-area').value,h=$('#f-hint');if(v.trim().length<2){h.textContent='';return}
 const r=normRegion(v);h.textContent=r?_('→ 분류 지역: ','→ Region: ')+lab(regOf(r)):''}
function submitReq(){
 const type=$('#f-type').value,cat=$('#f-cat').value,people=parseInt($('#f-people').value,10),area=$('#f-area').value.trim(),contact=$('#f-contact').value.trim(),m=$('#f-msg');
 const err=t=>{m.innerHTML=`<div class="msg err">${t}</div>`};
 if(!Number.isSafeInteger(people)||people<1||people>1000000)return err(_('피해 인원은 1명 이상 1,000,000명 이하의 정수로 입력해 주세요.','Enter a whole number from 1 to 1,000,000.'));
 if(!area)return err(_('지역을 입력해 주세요.','Please enter your area.'));
 if(!contact)return err(_('연락 방법을 입력해 주세요.','Please enter a contact method.'));
  if(contact.length>80)return err(_('연락 방법은 80자 이내로 입력해 주세요.','Contact information must be 80 characters or fewer.'));
 let reg=normRegion(area);
 if(!reg){const sel=$('#f-reg').value;$('#f-reg-box').classList.remove('hide');if(!sel)return err(_('지역을 자동으로 분류하지 못했습니다. 지구를 선택해 주세요.','Could not classify the area automatically. Please select a district.'));reg=sel}
 const r={id:newNo(),type,cat,people,region:reg,regionInput:area,contact,created:stamp(),updated:stamp(),status:'received',agency:null};
 r.verified=factCheck(r);
 S.requests.unshift(r);S.myNo=r.id;save();
 $('#app').querySelector('.card').innerHTML=`<h3>✅ ${_('접수 완료','Request received')}</h3>
  <p class="sub">${_('아래 접수번호를 꼭 저장하세요. 내요청확인에서 이 번호로 진행 상태를 확인할 수 있습니다.','Save this reception number. Use it in “My request” to check progress.')}</p>
  <div class="rcpt">${r.id}</div>
  <div class="meta">${_('분류 지역','Region')}: ${lab(regOf(reg))} · ${lab(by(CATS,cat))} · ${people}${_('명','')}</div>
  <div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn" onclick="S.vtab='mine';render()">${_('내 요청 확인','Check my request')}</button><button class="btn ghost" onclick="S.vtab='req';render()">${_('새 요청','New request')}</button></div>`}

function stepsHtml(st){const i=FLOW.indexOf(st);return `<div class="steps">${FLOW.map((f,j)=>`<span class="${j<i?'past':j===i?'on':''}">${_(FLOWL[f][0],FLOWL[f][1])}</span>`).join('')}</div>`}
function vMine(){return `<div class="card"><h3>${_('내 요청 진행 상태','My request status')}</h3>
 <p class="sub">${_('발급받은 접수번호로 처리 상태를 확인합니다. 입력한 번호와 일치하는 요청만 표시됩니다.','Check status with your reception number. Only the request matching the number is shown.')}</p>
 <label style="margin-top:0">${_('접수번호','Reception number')}</label>
 <div class="row" style="justify-content:flex-start;flex-wrap:nowrap"><input type="text" id="m-no" value="${esc(S.myNo)}" placeholder="WG-XXXXXX" onkeydown="if(event.key==='Enter')lookup()"><button class="btn" onclick="lookup()" style="white-space:nowrap">${_('조회','Search')}</button></div>
 <div class="chips">${_('데모 번호','Demo numbers')}: ${['WG-DEMO01','WG-DEMO03','WG-DEMO06'].map(n=>`<button class="btn ghost sm" onclick="demoNo('${n}')">${n}</button>`).join('')}</div>
 <div id="m-res">${S.myNo?myResult(S.myNo):''}</div></div>`}
function demoNo(n){S.myNo=n;render()}
function lookup(){S.myNo=$('#m-no').value.trim().toUpperCase();$('#m-res').innerHTML=S.myNo?myResult(S.myNo):''}
function myResult(no){const r=S.requests.find(x=>x.id===no);
 if(!r)return `<div class="msg err">${_('일치하는 접수번호가 없습니다. 번호를 다시 확인해 주세요.','No request matches that number. Please check it again.')}</div>`;
 return `<div class="req" style="margin-top:14px"><div class="top"><b>${esc(r.id)}</b><span class="badge b-blue">${_(FLOWL[r.status][0],FLOWL[r.status][1])}</span></div>
 ${stepsHtml(r.status)}
 <div class="meta">${lab(by(TYPES,r.type))} · ${lab(by(CATS,r.cat))} · ${r.people}${_('명',' people')} · ${lab(regOf(r.region))}</div>
 <div class="meta">${_('연결 기관','Linked agency')}: ${r.agency&&ORGS[r.agency]?ORGS[r.agency].name:_('아직 연결 전','Not linked yet')}</div>
 <div class="meta">${_('데모 기준 정보 대조','Official info check')}: ${r.verified?_('데모 기준 정보와 일치','Matches demo reference data'):_('대조 전 – 지원 연결은 계속 진행됩니다','Not yet checked – support linking continues')}</div>
 <div class="meta">${_('접수 시각','Received')}: ${fmt(r.created)} · ${_('최근 업데이트','Last update')}: ${fmt(r.updated||r.created)}</div></div>`}

function vPriv(){return `<div class="card"><h3>${_('개인정보 보호 및 안전 원칙','Privacy & safety principles')}</h3>
 <p class="sub">${_('위기ON은 피해자의 안전과 프라이버시를 최우선으로 합니다.','WIGION puts victims’ safety and privacy first.')}</p>
 <ul class="plain">
  <li>${_('정확한 위도/경도 좌표 대신 <b>동네(지역) 단위</b>까지만 수집합니다.','We collect only <b>neighborhood-level</b> location, never exact coordinates.')}</li>
  <li>${_('연락 방법은 데모용으로 입력되며 브라우저 저장소에 일반 텍스트로 저장됩니다. 실제 개인정보 대신 예시 정보를 사용하세요.','Contact details in this demo are stored as plain text in this browser. Do not enter real personal information.')}</li>
  <li>${_('‘내요청확인’은 접수번호로 요청을 검색하는 데모 기능입니다. 접수번호가 알려지면 다른 사람도 조회할 수 있으므로 실제 개인정보를 입력하지 마세요.','“My request” is a demo lookup by reception number. Anyone who knows the number may search it, so do not enter real personal information.')}</li></ul></div>`}

/* ---------- 지원기구 ---------- */
function agencyView(){
 if(!S.session){S.view='login';return login()}
 const o=ORGS[S.session.org];
 const tabs=[['map',_('피해 현황','Damage status')],['reqs',_('지원 요청','Requests')],['reg',_('지원 등록','Register support')]];
 const c=S.atab==='map'?aMap():S.atab==='reqs'?aReqs():aReg();
 return `<div class="page-head"><h2>${o.name} (${_(o.role[0],o.role[1])})</h2><button class="btn ghost sm" onclick="logout()">${_('로그아웃','Log out')}</button></div>
 <div class="tabs">${tabs.map(t=>`<button class="${S.atab===t[0]?'on':''}" onclick="S.atab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${c}`}

function aMap(){
 const ver=S.requests.filter(r=>r.verified),unv=S.requests.filter(r=>!r.verified);
 const tiles=REG.map(g=>{const rs=ver.filter(r=>r.region===g.id),n=rs.length,pp=rs.reduce((a,r)=>a+r.people,0),
  cls=n>=5?'t-red':n>=2?'t-org':'t-yel',un=unv.filter(r=>r.region===g.id).length;
  return `<div class="tile ${cls}" style="grid-area:${g.id}"><b>${lab(g)}</b><span class="n">${n}</span><span>${_('요청','requests')} · ${pp}${_('명',' ppl')}</span>${un?`<small>${_('미검증','unverified')} ${un}</small>`:''}</div>`}).join('');
 const max=Math.max(1,...CATS.map(c=>ver.filter(r=>r.cat===c.k).length));
 const bars=CATS.map(c=>{const n=ver.filter(r=>r.cat===c.k).length,u=unv.filter(r=>r.cat===c.k).length;
  return `<div class="bar"><span class="lb">${lab(c)}</span><span class="tr"><i style="width:${n/max*100}%"></i></span><span class="v">${n}${_('건',' req')}${u?` (${_('미검증','unverif.')} ${u})`:''}</span></div>`}).join('');
 const off=OFFICIAL.map(o=>`<tr><td>${lab(regOf(o.region))}</td><td>${lab(by(TYPES,o.type))}</td><td>${_(o.src[0],o.src[1])}</td></tr>`).join('');
 return `<div class="card"><h3>${_('지역별 피해 현황 지도 (가상 6개 지역)','Regional damage map (6 virtual regions)')}</h3>
  <p class="sub">${_('코드에 입력된 가상 기준 데이터와 일치하는 요청만 통계에 반영됩니다. 실제 기관의 공식 정보 조회는 아닙니다.','Only requests matching hard-coded sample data count toward the statistics. This is not a live official-data check.')}</p>
  <div class="map">${tiles}</div><div class="legend">${_('범례: 🔴 대규모 (5건 이상) | 🟠 주의 (2~4건) | 🟡 안정 (0~1건)','Legend: 🔴 Large (5+) | 🟠 Caution (2–4) | 🟡 Stable (0–1)')}</div></div>
 <div class="card"><h3>${_('지원 분야별 피해 요청 통계','Requests by support category')}</h3>${bars}</div>
 <div class="card"><h3>${_('가상 재난 기준 데이터 (대조 예시)','Sample disaster reference data')}</h3>
  <div style="overflow-x:auto"><table><tr><th>${_('지역','Region')}</th><th>${_('유형','Type')}</th><th>${_('출처','Source')}</th></tr>${off}</table></div></div>`}

function aReqs(){
 const f=S.filter,list=S.requests.filter(r=>f==='all'||r.type===f);
 return `<div class="card"><h3>${_('피해자 지원 요청 목록 (브라우저 저장 데모)','Victim support requests (browser demo)')}</h3>
 <p class="sub">${_('요청을 확인하고 상태를 변경하면 같은 브라우저의 ‘내 요청’에 반영됩니다. 실제 기관·다른 기기와 연동되지는 않으며, 상태는 순서대로만 변경할 수 있습니다.','Changes appear in “My request” in this browser only. There is no connection to real agencies or other devices. Status moves one step at a time.')}</p>
 <label style="margin-top:0">${_('피해 유형 필터','Damage type filter')}</label>
 <select onchange="S.filter=this.value;render()" style="max-width:300px"><option value="all">${_('전체','All')}</option>${TYPES.map(t=>`<option value="${t.k}" ${f===t.k?'selected':''}>${lab(t)}</option>`).join('')}</select></div>
 ${list.length?list.map(reqCard).join(''):`<div class="card sub">${_('표시할 요청이 없습니다.','No requests to show.')}</div>`}`}

function reqCard(r){
 const me=S.session.org,nx=nextOf(r);
 const vb=r.verified?`<span class="badge b-ok">✔ ${_('기준 일치','Verified')}</span>`:`<span class="badge b-gray">${_('미검증','Unverified')}</span>`;
 let act='';
 if(r.status==='done')act=`<div class="meta">${_('지원이 완료된 요청입니다.','This request is completed.')}</div>`;
 else if(nx==='linked'){const el=orgsEligible(r);
  act=el.length?`<select id="ag-${r.id}">${el.map(a=>`<option value="${a.org}">${ORGS[a.org].name}</option>`).join('')}</select><button class="btn sm" onclick="advance('${r.id}')">${_('기관 연결','Link agency')}</button>`
   :`<span class="msg err" style="margin:0">${_('연결 가능한 기관이 없습니다 (운영 중인 기관만 연결됩니다).','No eligible agency (only agencies in Active status can be linked).')}</span>`}
 else if(r.agency&&r.agency!==me)act=`<span class="meta">${_('담당 기관(','Handled by ')}${ORGS[r.agency].name}${_(')만 다음 단계로 변경할 수 있습니다.',' only can move this to the next step.')}</span>`;
 else act=`<button class="btn sm" onclick="advance('${r.id}')">${_('다음 단계로: ','Next step: ')}${_(FLOWL[nx][0],FLOWL[nx][1])}</button>`;
 if(!r.verified)act+=`<button class="btn sm ghost" onclick="recheck('${r.id}')">${_('데모 기준 정보 대조','Check demo reference')}</button>`;
 return `<div class="req"><div class="top"><b>${esc(r.id)}</b><span>${vb} <span class="badge b-blue">${_(FLOWL[r.status][0],FLOWL[r.status][1])}</span></span></div>
 <div class="meta">${lab(by(TYPES,r.type))} · ${lab(by(CATS,r.cat))} · ${r.people}${_('명',' ppl')} · ${lab(regOf(r.region))} (${_('입력','input')}: ${esc(r.regionInput)})</div>
 <div class="meta">${_('연락처','Contact')}: ${esc(r.contact)} · ${_('연결 기관','Agency')}: ${r.agency&&ORGS[r.agency]?ORGS[r.agency].name:'-'} · ${fmt(r.created)}</div>
 ${stepsHtml(r.status)}<div class="act">${act}</div>${NOMATCH[r.id]&&!r.verified?`<div class="msg info">${_('가상 기준 데이터와 일치하지 않아 통계에 반영되지 않았습니다.','No sample-data match was found, so it is excluded from the statistics.')}</div>`:''}</div>`}

function advance(id){const r=S.requests.find(x=>x.id===id);if(!r)return;const nx=nextOf(r);if(!nx)return;
 if(nx==='linked'){const sel=$('#ag-'+id);const org=sel&&sel.value;if(!org||!orgsEligible(r).some(a=>a.org===org))return;r.agency=org}
 else if(r.agency&&r.agency!==S.session.org)return;
 r.status=nx;r.updated=stamp();save();render()}
const NOMATCH={};
function recheck(id){const r=S.requests.find(x=>x.id===id);if(!r)return;
 if(factCheck(r)){r.verified=true;r.updated=stamp();delete NOMATCH[id];save();render()}
 else{NOMATCH[id]=1;render()}}

function aReg(){
 const mine=S.agencies.filter(a=>a.org===S.session.org);
 const row=a=>`<tr><td>${ORGS[a.org].name}</td><td>${a.cats.map(k=>lab(by(CATS,k))).join(', ')}</td><td>${a.region==='ALL'?_('전체','All'):lab(regOf(a.region))}</td>
 <td><span class="badge ${by(AGST,a.status).c}">${lab(by(AGST,a.status))}</span></td>
 <td>${a.org===S.session.org?`<select onchange="setAg('${a.id}',this.value)" style="width:auto;padding:4px">${AGST.map(s=>`<option value="${s.k}" ${a.status===s.k?'selected':''}>${lab(s)}</option>`).join('')}</select> <button class="btn sm ghost" onclick="delAg('${a.id}')">${_('삭제','Delete')}</button>`:''}</td></tr>`;
 return `<div class="card"><h3>${_('우리 기관 지원 현황 등록','Register our support status')}</h3>
 <p class="sub">${_('현재 투입 가능한 지원 분야와 가동 상태를 등록합니다. ‘운영 중’인 기관만 피해자 요청에 연결됩니다.','Register available support fields and operating status. Only “Active” agencies are linked to requests.')}</p>
 <label style="margin-top:0">${_('지원 분야','Support fields')}</label><div class="cb">${CATS.map(c=>`<label><input type="checkbox" name="rc" value="${c.k}"> ${lab(c)}</label>`).join('')}</div>
 <label>${_('상태 배지 선택','Status badge')}</label><select id="r-st">${AGST.map(s=>`<option value="${s.k}">${lab(s)}</option>`).join('')}</select>
 <label>${_('담당 지역','Area of responsibility')}</label><select id="r-rg"><option value="ALL">${_('전체','All regions')}</option>${REG.map(r=>`<option value="${r.id}">${lab(r)}</option>`).join('')}</select>
 <div style="margin-top:14px"><button class="btn" onclick="addAg()">${_('지원 정보 등록 및 게시','Register & publish')}</button></div><div id="r-msg"></div></div>
 <div class="card"><h4 style="margin:0 0 8px">${_('등록된 기관 지원 정보','Registered agency support info')}</h4>
 <div style="overflow-x:auto"><table><tr><th>${_('기관','Agency')}</th><th>${_('지원 분야','Fields')}</th><th>${_('담당 지역','Region')}</th><th>${_('상태','Status')}</th><th></th></tr>${S.agencies.map(row).join('')}</table></div></div>
 <div class="card"><h4 style="margin:0 0 6px">${_('데모 데이터 초기화','Reset demo data')}</h4><p class="sub">${_('접수된 요청과 등록 정보를 처음 상태로 되돌립니다.','Restore all requests and registrations to the initial demo state.')}</p>
 ${S.resetAsk?`<div class="act"><span class="meta">${_('정말 초기화할까요?','Reset everything?')}</span><button class="btn sm" onclick="doReset()">${_('초기화','Reset')}</button><button class="btn sm ghost" onclick="S.resetAsk=false;render()">${_('취소','Cancel')}</button></div>`:`<button class="btn sm ghost" onclick="S.resetAsk=true;render()">${_('초기화','Reset')}</button>`}</div>`}
function doReset(){S.resetAsk=false;S.checks={};S.myNo='';seed();render()}
function addAg(){const cats=[...document.querySelectorAll('input[name=rc]:checked')].map(x=>x.value);
 if(!cats.length){$('#r-msg').innerHTML=`<div class="msg err">${_('지원 분야를 하나 이상 선택해 주세요.','Select at least one support field.')}</div>`;return}
 S.agencies.push({id:'a'+Date.now(),org:S.session.org,cats,status:$('#r-st').value,region:$('#r-rg').value});save();render()}
function setAg(id,v){const a=S.agencies.find(x=>x.id===id);if(a&&a.org===S.session.org){a.status=v;save();render()}}
function delAg(id){S.agencies=S.agencies.filter(a=>!(a.id===id&&a.org===S.session.org));save();render()}

load();render();
window.addEventListener('storage',e=>{if(e.key!==KEY)return;load();if(S.view==='agency'||(S.view==='victim'&&S.vtab==='mine'))render()});
</script>
</body>
</html>
